name: snyk-org-scan

on:
  schedule:
    - cron: '42 6 * * *'
      timezone: 'Europe/Zurich'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo name (empty = all)'
        required: false
      monitor:
        description: 'Also run snyk monitor'
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-scan-${{ github.event.client_payload.repo || inputs.repo || 'all' }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      m2-cache-prefix: ${{ steps.list.outputs.m2-cache-prefix }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINGLE: ${{ github.event.client_payload.repo || inputs.repo }}
          # Repos that are not scannable code projects (or shouldn't be scanned
          # by this workflow) and are therefore always skipped from discovery.
          EXCLUDED_REPOS: "jeap-security-scan,jeap,.github,jeap-admin-ch.github.io"
        run: |
          set -euo pipefail
          # Key prefix of the shared Maven cache (see the warm-up job). The month
          # makes the cache start from scratch once a month, so that dependency
          # versions no repo uses any more drop out of it.
          echo "m2-cache-prefix=m2-shared-$(date -u +%Y-%m)-" >> "$GITHUB_OUTPUT"
          if [ -n "${SINGLE:-}" ]; then
            echo "repos=$(jq -cn --arg r "$SINGLE" '[$r]')" >> "$GITHUB_OUTPUT"
          else
            EXCLUDE_JSON=$(jq -cn --arg csv "$EXCLUDED_REPOS" '$csv | split(",") | map(select(length>0))')
            gh api --paginate orgs/jeap-admin-ch/repos \
              --jq '.[] | select(.archived==false and .fork==false and .visibility=="public") | .name' \
              | jq -R -s -c --argjson exclude "$EXCLUDE_JSON" \
                'split("\n") | map(select(length>0)) | map(select(. as $n | ($exclude | index($n)) == null))' > repos.json
            echo "repos=$(cat repos.json)" >> "$GITHUB_OUTPUT"
          fi

  # Maven Central throttles the runners (HTTP 429, or 404 for files that exist)
  # when every matrix job downloads its dependencies on its own. The jEAP repos
  # share most of their dependencies, so this job builds a few of the largest
  # ones first and saves the local Maven repository as one cache, which every
  # matrix job then restores.
  # A cache per repo does not work here: keyed on the hash of the poms it is
  # invalidated by almost every commit, and all of them together exceed the
  # cache storage limit of this repo, so they are evicted before the next run.
  warm-up:
    needs: discover
    # A scan of a single repo uses the cache of the last full run as it is.
    if: ${{ !(github.event.client_payload.repo || inputs.repo) }}
    runs-on: ubuntu-latest
    # Only an optimisation: the scans run without it and decide the result of
    # the workflow.
    continue-on-error: true
    env:
      # The repos with the largest dependency sets. "Maven downloads" in the
      # overview shows what the scans still had to download with this choice.
      WARM_UP_REPOS: jeap-error-handling jeap-process-context-service jeap-messaging
    steps:
      - name: Checkout warm-up repos
        run: |
          for repo in $WARM_UP_REPOS; do
            git clone --quiet --depth 1 "https://github.com/jeap-admin-ch/$repo.git" "warm-up/$repo"
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Maven wrapper distributions
        id: mvnw-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/wrapper/dists
          key: mvnw-${{ hashFiles('warm-up/*/mvnw', 'warm-up/*/.mvn/wrapper/*') }}

      # The key has no hash on purpose: the cache is taken over from the newest
      # one (restore-keys) and saved under a new key, as a cache cannot be
      # updated. Older ones are left to the eviction of GitHub. If the cache
      # ever causes problems, delete all caches of this repo: the next run
      # builds a new one.
      - name: Restore shared Maven cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ needs.discover.outputs.m2-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ needs.discover.outputs.m2-cache-prefix }}

      - name: Build warm-up repos
        id: build
        run: |
          set -uo pipefail
          # Keep in sync with "Build Maven reactor for Snyk" in the snyk job.
          DOWNLOAD_ERRORS='status code: (429|5[0-9]{2})|Too Many Requests|Could not (transfer|find) artifact|FileNotFoundException|Server returned HTTP response code|Failed to fetch|timed out|Connection (reset|refused)'
          maven_install() {
            local mvn=mvn attempt
            if [ -f ./mvnw ]; then
              chmod +x ./mvnw
              mvn=./mvnw
            fi
            for attempt in 1 2 3; do
              "$mvn" -B -q install \
                -DskipTests -Dskip.surefire.tests=true -Dskip.failsafe.tests=true \
                -Dmaven.test.failure.ignore=true -Dmaven.javadoc.skip=true 2>&1 | tee "$RUNNER_TEMP/maven.log" && return 0
              [ "$attempt" -lt 3 ] && grep -qiE "$DOWNLOAD_ERRORS" "$RUNNER_TEMP/maven.log" || return 1
              echo "::warning::Download from a Maven repository failed (attempt $attempt of 3), retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            done
          }
          succeeded=0
          failed=0
          for repo in $WARM_UP_REPOS; do
            echo "::group::$repo"
            if (cd "warm-up/$repo" && maven_install); then
              succeeded=$((succeeded + 1))
            else
              failed=$((failed + 1))
              echo "::warning::Warm-up build of $repo failed, its dependencies may be missing in the shared Maven cache"
            fi
            echo "::endgroup::"
          done
          echo "succeeded=$succeeded" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # A cache is never updated once it exists, so only save the distributions
      # when every build got its own: an incomplete cache would make every
      # later run download the missing ones.
      - name: Check Maven wrapper distributions
        id: mvnw-dist
        if: ${{ steps.mvnw-cache.outputs.cache-hit != 'true' && steps.build.outputs.failed == '0' }}
        run: |
          if [ -n "$(find ~/.m2/wrapper/dists -path '*/bin/mvn' -print -quit 2>/dev/null)" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Maven wrapper distributions
        if: ${{ steps.mvnw-dist.outputs.complete == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ steps.mvnw-cache.outputs.cache-primary-key }}

      # The builds install the SNAPSHOT modules of the warm-up repos. They stay
      # out of the shared cache: every scanned repo builds its own modules and
      # must not pick up the ones of another build.
      - name: Remove snapshots from the local Maven repository
        run: |
          if [ -d ~/.m2/repository ]; then
            find ~/.m2/repository -type d -name '*-SNAPSHOT' -prune -exec rm -rf {} +
          fi

      # Without a successful build the local repository may be nearly empty,
      # and as the newest cache it would replace a good one for the scans.
      - name: Save shared Maven cache
        if: ${{ steps.build.outputs.succeeded != '0' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ needs.discover.outputs.m2-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}

  snyk:
    needs: [discover, warm-up]
    # Also run when the warm-up job was skipped (scan of a single repo) or failed.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v7
        with:
          repository: jeap-admin-ch/${{ matrix.repo }}
          path: target-repo
          persist-credentials: false

      # No "cache: maven" here, see the warm-up job and the wrapper cache below.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: snyk/actions/setup@master

      # Keyed on the wrapper itself and not only on maven-wrapper.properties:
      # where a wrapper stores the distribution below dists depends on its kind
      # and version (script only, Takari jar, Apache jar). Repos with the same
      # properties and different wrappers would otherwise share a cache that
      # holds the distribution of only one of them, and the others would
      # download Maven on every run despite the cache hit.
      - name: Restore Maven wrapper distribution
        id: mvnw-cache
        if: ${{ hashFiles('target-repo/mvnw') != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/wrapper/dists
          key: mvnw-${{ hashFiles('target-repo/mvnw', 'target-repo/.mvn/wrapper/*') }}

      # Restore only: the warm-up job is the only one that saves this cache.
      # The key matches the cache the warm-up job of this run saved, and
      # restore-keys falls back to the newest one of an earlier run.
      - name: Restore shared Maven cache
        if: ${{ hashFiles('target-repo/**/pom.xml') != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ needs.discover.outputs.m2-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ needs.discover.outputs.m2-cache-prefix }}

      # Reference point for "Count Maven downloads".
      - name: Mark the restored state of the local Maven repository
        run: touch "$RUNNER_TEMP/m2-restored"

      # Multi-module Maven repos depend on their own (SNAPSHOT) sibling
      # modules. Without installing them, Snyk cannot resolve those and drops
      # their transitive dependencies from the dependent module's tree.
      - name: Build Maven reactor for Snyk
        if: ${{ hashFiles('target-repo/pom.xml') != '' }}
        continue-on-error: true
        working-directory: target-repo
        # The jEAP parent hardwires skipTests to skip.surefire.tests / skip.failsafe.tests,
        # so -DskipTests alone has no effect there.
        run: |
          set -o pipefail
          # Maven Central sometimes answers single requests with 429, or with 404 for files that
          # exist. Retry the build in that case only: one that fails for another reason (some repos
          # cannot be built here at all) would just fail again.
          # Keep in sync with "Build warm-up repos" in the warm-up job.
          DOWNLOAD_ERRORS='status code: (429|5[0-9]{2})|Too Many Requests|Could not (transfer|find) artifact|FileNotFoundException|Server returned HTTP response code|Failed to fetch|timed out|Connection (reset|refused)'
          maven_install() {
            local mvn=mvn attempt
            # Prefer the repo's Maven wrapper so the build uses the Maven version the repo pins.
            if [ -f ./mvnw ]; then
              chmod +x ./mvnw
              mvn=./mvnw
            fi
            for attempt in 1 2 3; do
              "$mvn" -B -q install \
                -DskipTests -Dskip.surefire.tests=true -Dskip.failsafe.tests=true \
                -Dmaven.test.failure.ignore=true -Dmaven.javadoc.skip=true 2>&1 | tee "$RUNNER_TEMP/maven.log" && return 0
              [ "$attempt" -lt 3 ] && grep -qiE "$DOWNLOAD_ERRORS" "$RUNNER_TEMP/maven.log" || return 1
              echo "::warning::Download from a Maven repository failed (attempt $attempt of 3), retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            done
          }
          maven_install

      # A cache is never updated once it exists, so only save a complete
      # distribution: an incomplete one would make every later run download it.
      - name: Check Maven wrapper distribution
        id: mvnw-dist
        if: ${{ steps.mvnw-cache.outcome == 'success' && steps.mvnw-cache.outputs.cache-hit != 'true' }}
        run: |
          if [ -n "$(find ~/.m2/wrapper/dists -path '*/bin/mvn' -print -quit 2>/dev/null)" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Maven wrapper distribution
        if: ${{ steps.mvnw-dist.outputs.complete == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ steps.mvnw-cache.outputs.cache-primary-key }}

      # Upload SARIF resolves the commit via `git rev-parse HEAD` at the
      # checkout path, not GITHUB_SHA. Left in place, that would point at
      # matrix.repo's commit, which doesn't exist in this (jeap-security-scan)
      # repo and the API upload fails with "commit not found". Dropping the
      # checked-out .git makes the action fall back to this workflow's own
      # GITHUB_SHA/GITHUB_REF, which is what the upload actually targets.
      - name: Detach checked-out repo from its own git history
        run: rm -rf target-repo/.git

      - name: Snyk Open Source test
        id: snyk-test
        working-directory: target-repo
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_EXCLUDE: ${{ matrix.repo == 'jeap-agent-marketplace' && 'fixtures,target' || 'target' }}
        run: |
          # Don't fail here: SARIF merge/upload must still run. The exit code
          # is evaluated in the "Fail on vulnerabilities" step at the end.
          # Snyk exit codes: 0 = clean, 1 = vulnerabilities, 2 = scan error,
          # 3 = no supported projects found.
          # Snyk's --fail-on=upgradable only counts issues with a *direct* upgrade
          # path and would hide issues that are fixable by a transitive override
          # (e.g. a dependencyManagement pin). Instead the "fixable" output counts
          # all High/Critical findings that have a fixed version (fixedIn) at all.
          # Findings without any fix do not fail the job but stay in the SARIF upload.
          # SNYK_EXCLUDE: directory/file names skipped by the scan: build output (target, e.g. poms
          # generated by the avro plugin without the repo parent) and, for jeap-agent-marketplace, the
          # eval fixtures under evals/ (test projects, not shipped code).
          set +e
          snyk test \
            --all-projects \
            --detection-depth=6 \
            --severity-threshold=high \
            ${SNYK_EXCLUDE:+--exclude="$SNYK_EXCLUDE"} \
            --remote-repo-url=https://github.com/jeap-admin-ch/${{ matrix.repo }} \
            --sarif-file-output=snyk.sarif \
            --json-file-output=snyk.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          # Number of findings with a fixed version. "unknown" (fail closed) if the
          # JSON is missing or unreadable. --all-projects yields an array of results.
          FIXABLE_JQ='[ (if type == "array" then .[] else . end)
                        | (.vulnerabilities? // [])[]
                        | select(((.fixedIn // []) | length) > 0) ]'
          fixable=$(jq "$FIXABLE_JQ | length" snyk.json 2>/dev/null || echo unknown)
          echo "fixable=$fixable" >> "$GITHUB_OUTPUT"
          echo "High/Critical findings with a fixed version: $fixable"
          if [ "$fixable" != "0" ] && [ "$fixable" != "unknown" ]; then
            jq -r "$FIXABLE_JQ | unique_by(.id)[]
                   | \"  \(.id) \(.packageName)@\(.version) -> fixed in \(.fixedIn | join(\", \"))\"" snyk.json
          fi
          # A stub with an empty "runs" array can be rejected by the code
          # scanning upload API ("Invalid request"), so include minimal but
          # valid tool/run information instead.
          test -f snyk.sarif || jq -n \
            '{
              version: "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              runs: [
                {
                  tool: {
                    driver: {
                      name: "Snyk Open Source",
                      rules: []
                    }
                  },
                  results: []
                }
              ]
            }' > snyk.sarif

      # --all-projects with a wide detection depth typically produces one
      # SARIF "run" per manifest file, which can easily exceed the code
      # scanning hard limit of 20 runs per file (results in "rejecting SARIF,
      # as there are more runs than allowed"). Collapse everything into a
      # single run, de-duplicating rules and remapping result ruleIndex
      # references accordingly.
      - name: Merge SARIF runs
        working-directory: target-repo
        run: |
          python3 - <<'EOF'
          import json

          with open("snyk.sarif") as f:
              data = json.load(f)

          runs = data.get("runs", [])
          if len(runs) > 1:
              merged_rules = []
              rule_id_to_index = {}
              merged_results = []

              for run in runs:
                  rules = run.get("tool", {}).get("driver", {}).get("rules", [])
                  local_map = {}
                  for i, rule in enumerate(rules):
                      rid = rule.get("id")
                      if rid not in rule_id_to_index:
                          rule_id_to_index[rid] = len(merged_rules)
                          merged_rules.append(rule)
                      local_map[i] = rule_id_to_index[rid]

                  for result in run.get("results", []):
                      if "ruleIndex" in result and result["ruleIndex"] in local_map:
                          result["ruleIndex"] = local_map[result["ruleIndex"]]
                      merged_results.append(result)

              driver = runs[0].get("tool", {}).get("driver", {})
              driver["rules"] = merged_rules
              data["runs"] = [{"tool": {"driver": driver}, "results": merged_results}]

              with open("snyk.sarif", "w") as f:
                  json.dump(data, f)
          EOF

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target-repo/snyk.sarif
          checkout_path: target-repo
          category: snyk-oss-${{ matrix.repo }}

      # Artifacts that were not in the shared Maven cache and had to be
      # downloaded, without the SNAPSHOT modules the build installed. The
      # overview lists them per repo to show how well the warm-up job covers
      # the dependencies. Compares the inode change time, as Maven may set the
      # modification time of a download to the one on the server.
      - name: Count Maven downloads
        id: m2-downloads
        if: ${{ always() && hashFiles('target-repo/**/pom.xml') != '' }}
        run: |
          stats="0 0"
          if [ -d ~/.m2/repository ] && [ -f "$RUNNER_TEMP/m2-restored" ]; then
            stats=$(find ~/.m2/repository -type f \( -name '*.jar' -o -name '*.pom' \) \
              -cnewer "$RUNNER_TEMP/m2-restored" -not -path '*-SNAPSHOT/*' -printf '%s\n' \
              | awk '{ bytes += $1 } END { printf "%d %d", NR, bytes / 1048576 }')
          fi
          echo "files=${stats% *}" >> "$GITHUB_OUTPUT"
          echo "mb=${stats#* }" >> "$GITHUB_OUTPUT"
          echo "Downloaded ${stats% *} artifacts (${stats#* } MB) that were not in the shared Maven cache"

      # Compact per-repo result for the "overview" job (one row per finding,
      # with the manifests it appears in).
      - name: Collect result
        if: ${{ always() }}
        working-directory: target-repo
        env:
          REPO: ${{ matrix.repo }}
          EXIT_CODE: ${{ steps.snyk-test.outputs.exit_code }}
          FIXABLE: ${{ steps.snyk-test.outputs.fixable }}
          M2_FILES: ${{ steps.m2-downloads.outputs.files }}
          M2_MB: ${{ steps.m2-downloads.outputs.mb }}
        run: |
          findings='[]'
          if [ -f snyk.json ]; then
            findings=$(jq -c '
              [ (if type == "array" then .[] else . end)
                | select(type == "object" and has("vulnerabilities"))
                | . as $p
                | $p.vulnerabilities[]
                | { id, title, severity, package: .packageName, version,
                    fixedIn: (.fixedIn // []),
                    cve: (.identifiers.CVE // []),
                    target: ($p.displayTargetFile // $p.path // "") } ]
              | group_by([.id, .package, .version])
              | map({ id: .[0].id, title: .[0].title, severity: .[0].severity,
                      package: .[0].package, version: .[0].version,
                      fixedIn: .[0].fixedIn, cve: .[0].cve,
                      targets: (map(.target) | unique) })' snyk.json || echo '[]')
          fi
          jq -n -c --arg repo "$REPO" --arg exit_code "$EXIT_CODE" --arg fixable "$FIXABLE" \
            --arg m2_files "$M2_FILES" --arg m2_mb "$M2_MB" \
            --argjson findings "$findings" \
            '{ repo: $repo, exit_code: $exit_code, fixable: $fixable,
               m2_files: $m2_files, m2_mb: $m2_mb, findings: $findings }' > result.json

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: snyk-result-${{ matrix.repo }}
          path: target-repo/result.json
          retention-days: 1

      - name: Fail on vulnerabilities
        # Exit code 1 (vulnerabilities) only fails the job if at least one finding has a fixed version.
        if: ${{ always() && steps.snyk-test.outputs.exit_code != '0' && steps.snyk-test.outputs.exit_code != '3' && !(steps.snyk-test.outputs.exit_code == '1' && steps.snyk-test.outputs.fixable == '0') }}
        run: |
          echo "::error::snyk test exited with code ${{ steps.snyk-test.outputs.exit_code || 'unknown' }} (1 = vulnerabilities found, 2 = scan error), findings with a fixed version: ${{ steps.snyk-test.outputs.fixable || 'unknown' }}"
          exit 1

      # Only snapshot when the code actually moved, not on every daily sweep.
      - name: Snyk monitor
        if: github.event_name == 'repository_dispatch' || inputs.monitor
        continue-on-error: true
        working-directory: target-repo
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_EXCLUDE: ${{ matrix.repo == 'jeap-agent-marketplace' && 'fixtures,target' || 'target' }}
        run: |
          snyk monitor \
            --all-projects \
            --detection-depth=6 \
            ${SNYK_EXCLUDE:+--exclude="$SNYK_EXCLUDE"} \
            --remote-repo-url=https://github.com/jeap-admin-ch/${{ matrix.repo }} \
            --project-name=${{ matrix.repo }}

  overview:
    needs: [discover, snyk]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: snyk-result-*
          path: results

      - name: Overview
        env:
          REPOS: ${{ needs.discover.outputs.repos }}
        run: |
          python3 - <<'EOF'
          import glob, json, os

          repos = json.loads(os.environ["REPOS"])
          results = {}
          for f in glob.glob("results/*/result.json"):
              with open(f) as fh:
                  r = json.load(fh)
              results[r["repo"]] = r

          SEV = {"critical": 0, "high": 1, "medium": 2, "low": 3}
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")

          def w(line=""):
              out.write(line + "\n")

          def cell(text):
              return str(text).replace("|", "\\|").replace("\n", " ")

          def failing(r):
              code, fixable = r["exit_code"], r["fixable"]
              if code in ("0", "3"):
                  return False
              return not (code == "1" and fixable == "0")

          # Group findings by vulnerability id.
          vulns = {}
          for repo, r in results.items():
              for f in r["findings"]:
                  v = vulns.setdefault(f["id"], {
                      "id": f["id"], "title": f["title"], "severity": f["severity"],
                      "package": f["package"], "fixedIn": f["fixedIn"], "cve": f["cve"],
                      "repos": {}})
                  e = v["repos"].setdefault(repo, {"versions": set(), "targets": set()})
                  e["versions"].add(f["version"])
                  e["targets"].update(t for t in f["targets"] if t)

          def sort_key(v):
              return (SEV.get(v["severity"], 9), -len(v["repos"]), v["package"], v["id"])

          fixable = sorted((v for v in vulns.values() if v["fixedIn"]), key=sort_key)
          unfixable = sorted((v for v in vulns.values() if not v["fixedIn"]), key=sort_key)
          failed = sorted(repo for repo, r in results.items() if failing(r))
          no_result = sorted(set(repos) - set(results))
          errors = sorted(repo for repo, r in results.items() if r["exit_code"] == "2")

          w("# Snyk scan overview")
          w()
          w(f"- Repositories scanned: **{len(results)}** of {len(repos)}")
          w(f"- Failing the gate (scan error, or a finding with a fix): **{len(failed)}**")
          w(f"- Distinct High/Critical vulnerabilities: **{len(vulns)}** "
            f"({len(fixable)} with a fix, {len(unfixable)} without)")
          w()

          if failed:
              w("## Failing repositories")
              w()
              w("| Repository | Reason |")
              w("|---|---|")
              for repo in failed:
                  r = results[repo]
                  if r["exit_code"] == "1":
                      reason = f"{r['fixable']} finding(s) with a fixed version"
                  elif r["exit_code"] == "2":
                      reason = "scan error (exit code 2), results may be incomplete"
                  else:
                      reason = f"unexpected exit code {r['exit_code'] or 'unknown'}"
                  w(f"| {repo} | {reason} |")
              w()

          if no_result or errors:
              w("## Incomplete scans")
              w()
              for repo in errors:
                  w(f"- `{repo}`: scan error, results may be incomplete")
              for repo in no_result:
                  w(f"- `{repo}`: no result (job failed before the scan finished)")
              w()

          def table(title, items, with_fix):
              w(f"## {title}")
              w()
              if not items:
                  w("None.")
                  w()
                  return
              head = "| Severity | Package | Vulnerability | " + ("Fixed in | " if with_fix else "")
              w(head + "Repositories |")
              w("|---|---|---|" + ("---|" if with_fix else "") + "---|")
              for v in items:
                  versions = sorted({ver for e in v["repos"].values() for ver in e["versions"]})
                  ids = ", ".join(v["cve"]) if v["cve"] else v["id"]
                  link = f"[{cell(v['title'])}](https://security.snyk.io/vuln/{v['id']})"
                  row = (f"| {v['severity']} | `{v['package']}` {', '.join(versions)} "
                         f"| {link} ({ids}) | ")
                  if with_fix:
                      row += ", ".join(v["fixedIn"]) + " | "
                  row += ", ".join(sorted(v["repos"])) + " |"
                  w(row)
              w()

          table("Vulnerabilities with a fix", fixable, True)
          table("Vulnerabilities without a fix", unfixable, False)

          # Where do they appear: per repository, per manifest.
          w("## By repository")
          w()
          any_repo = False
          for repo in sorted(results):
              findings = results[repo]["findings"]
              if not findings:
                  continue
              any_repo = True
              w(f"<details><summary><b>{repo}</b> - {len(findings)} finding(s)</summary>")
              w()
              for f in sorted(findings, key=lambda f: (SEV.get(f["severity"], 9), f["package"])):
                  fix = f"fixed in {', '.join(f['fixedIn'])}" if f["fixedIn"] else "no fix"
                  targets = ", ".join(f"`{t}`" for t in f["targets"]) or "-"
                  w(f"- {f['severity']}: `{f['package']}` {f['version']} - "
                    f"[{f['id']}](https://security.snyk.io/vuln/{f['id']}) ({fix}) in {targets}")
              w()
              w("</details>")
              w()
          if not any_repo:
              w("No findings.")
              w()

          # What the scans still had to download although the warm-up job filled the shared
          # Maven cache: a repo with many downloads is a candidate for WARM_UP_REPOS.
          counted = {repo: r for repo, r in results.items() if r.get("m2_files")}
          if counted:
              downloads = sorted(((int(r["m2_files"]), int(r.get("m2_mb") or 0), repo)
                                  for repo, r in counted.items() if int(r["m2_files"]) > 0),
                                 key=lambda d: (-d[0], d[2]))
              w("## Maven downloads")
              w()
              if downloads:
                  w(f"<details><summary>{len(downloads)} of {len(counted)} Maven repositories downloaded "
                    f"artifacts that were not in the shared Maven cache</summary>")
                  w()
                  w("| Repository | Artifacts | MB |")
                  w("|---|---:|---:|")
                  for files, mb, repo in downloads:
                      w(f"| {repo} | {files} | {mb} |")
                  w()
                  w("</details>")
              else:
                  w(f"All {len(counted)} Maven repositories were served from the shared Maven cache.")
          EOF

      # The per-repo results are only needed to build the overview, don't leave
      # them as artifacts on the run page.
      - name: Delete result artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("snyk-result-")) | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" --silent \
                  || echo "Could not delete artifact $id"
              done

  notify-ms-teams:
    needs: [discover, snyk]
    if: always() && (needs.discover.result == 'failure' || needs.snyk.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Microsoft Teams in case of scan failure
        env:
          MS_TEAMS_WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK }}
          DISCOVER_STATUS: ${{ needs.discover.result }}
          SNYK_STATUS: ${{ needs.snyk.result }}
        run: |
          if [ -z "$MS_TEAMS_WEBHOOK" ]; then
            echo "MS_TEAMS_WEBHOOK is not configured"
            exit 0
          fi

          format_status() {
            case "$1" in
              success)
                echo "🟢 Success"
                ;;
              failure)
                echo "🔴 Failed"
                ;;
              cancelled)
                echo "🟡 Cancelled"
                ;;
              skipped)
                echo "⚪ Skipped"
                ;;
              *)
                echo "⚪ ${1:-Unknown}"
                ;;
            esac
          }

          DISCOVER_STATUS_TEXT="$(format_status "$DISCOVER_STATUS")"
          SNYK_STATUS_TEXT="$(format_status "$SNYK_STATUS")"

          if [ "$DISCOVER_STATUS" = "failure" ] || [ "$SNYK_STATUS" = "failure" ]; then
            OVERALL_STATUS="Failed"
            OVERALL_ICON="🔴"
          elif [ "$DISCOVER_STATUS" = "cancelled" ] || [ "$SNYK_STATUS" = "cancelled" ]; then
            OVERALL_STATUS="Cancelled"
            OVERALL_ICON="🟡"
          else
            OVERALL_STATUS="${DISCOVER_STATUS:-${SNYK_STATUS:-Unknown}}"
            OVERALL_ICON="⚪"
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg workflow "${{ github.workflow }}" \
            --arg project "${{ github.repository }}" \
            --arg status "$OVERALL_STATUS" \
            --arg statusIcon "$OVERALL_ICON" \
            --arg discoverStatus "$DISCOVER_STATUS_TEXT" \
            --arg snykStatus "$SNYK_STATUS_TEXT" \
            --arg repository "${{ github.repository }}" \
            --arg actor "${{ github.actor }}" \
            --arg runId "${{ github.run_id }}" \
            --arg runUrl "$RUN_URL" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        text: "GitHub Actions",
                        weight: "Bolder",
                        size: "Medium"
                      },
                      {
                        type: "TextBlock",
                        text: ($workflow + " • " + $project),
                        weight: "Bolder",
                        size: "Large",
                        wrap: true
                      },
                      {
                        type: "FactSet",
                        facts: [
                          {
                            title: "Status",
                            value: ($statusIcon + " " + $status)
                          },
                          {
                            title: "Discover",
                            value: $discoverStatus
                          },
                          {
                            title: "Snyk scan",
                            value: $snykStatus
                          },
                          {
                            title: "Repository",
                            value: $repository
                          },
                          {
                            title: "Triggered by",
                            value: $actor
                          },
                          {
                            title: "Run",
                            value: ("#" + $runId)
                          }
                        ]
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "View GitHub Actions run",
                        url: $runUrl
                      }
                    ]
                  }
                }
              ]
            }' |
            http_code=$(curl --silent --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$MS_TEAMS_WEBHOOK" 2>/dev/null)
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "Teams notification failed (HTTP status: $http_code)"
              exit 1
            fi
