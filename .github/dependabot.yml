version: 2
updates:
  # This repo only contains GitHub Actions workflows, so Dependabot only
  # needs to track the actions/action versions used within them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Bundle all action updates into a single PR per schedule run instead
      # of one PR per action.
      github-actions:
        patterns:
          - "*"
